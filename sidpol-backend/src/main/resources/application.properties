spring.application.name=sidpol-backend.
# ==========================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MYSQL DOCKER)
# ==========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sidpoldb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==========================================
# 'update' creará o actualizará las tablas automáticamente en tu carpeta según tus clases de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
