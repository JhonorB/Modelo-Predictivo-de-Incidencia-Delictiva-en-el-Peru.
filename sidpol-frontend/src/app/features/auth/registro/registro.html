<div class="register-page">
  <div class="register-bg">
    <div class="shape shape--1"></div>
    <div class="shape shape--2"></div>
    <div class="shape shape--3"></div>
    <div class="shape shape--4"></div>
  </div>

  <div class="register-container">
    <div class="register-card">
      <div class="register-card-header">
        <div class="register-logo puzzle-piece" style="animation-delay: 0s;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1 class="register-title puzzle-piece" style="animation-delay: 0.1s;">Crear Cuenta</h1>
        <p class="register-subtitle puzzle-piece" style="animation-delay: 0.2s;">Regístrate en el Sistema de Predicción Delictiva</p>
      </div>

      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-group puzzle-piece" style="animation-delay: 0.25s;">
          <label for="nombre">Nombre Completo</label>
          <div class="input-wrapper">
            <input type="text" id="nombre" formControlName="nombre" placeholder="Ingresa tu nombre">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </div>
          <span class="error-msg" *ngIf="registroForm.get('nombre')?.touched && registroForm.get('nombre')?.errors?.['required']">
            El nombre es obligatorio
          </span>
        </div>

        <div class="form-group puzzle-piece" style="animation-delay: 0.35s;">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <input type="email" id="email" formControlName="email" placeholder="ejemplo@utp.edu.pe">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
          <span class="error-msg" *ngIf="registroForm.get('email')?.touched && registroForm.get('email')?.errors?.['email']">
            Ingresa un correo electrónico válido
          </span>
        </div>

        <div class="form-group puzzle-piece" style="animation-delay: 0.45s;">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" formControlName="password" placeholder="••••••••">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
          </div>
          <span class="error-msg" *ngIf="registroForm.get('password')?.touched && registroForm.get('password')?.errors?.['minlength']">
            La contraseña debe tener al menos 6 caracteres
          </span>
        </div>

        <button type="submit" [disabled]="registroForm.invalid" class="btn-submit puzzle-piece" style="animation-delay: 0.55s;">
          Crear Cuenta
        </button>

        <p class="feedback-msg puzzle-piece" style="animation-delay: 0.65s;" [ngClass]="{'error': error, 'success': !error}" *ngIf="mensaje">
          {{ mensaje }}
        </p>
      </form>

      <div class="register-card-footer puzzle-piece" style="animation-delay: 0.75s;">
        <p>¿Ya tienes una cuenta? <a routerLink="/login">Iniciar sesión</a></p>
      </div>
    </div>

    <div class="register-footer puzzle-piece" style="animation-delay: 0.85s;">
      <span>SIDPOL v2.0</span>
      <span>•</span>
      <span>Seguridad y Prevención</span>
    </div>
  </div>
</div>
