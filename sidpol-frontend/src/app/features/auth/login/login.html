<div class="login-page">
  <div class="login-bg">
    <div class="shape shape--1"></div>
    <div class="shape shape--2"></div>
    <div class="shape shape--3"></div>
    <div class="shape shape--4"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-logo puzzle-piece" style="animation-delay: 0s;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h1 class="login-title puzzle-piece" style="animation-delay: 0.1s;">SIDPOL</h1>
        <p class="login-subtitle puzzle-piece" style="animation-delay: 0.2s;">Sistema de Predicción Delictiva</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group puzzle-piece" style="animation-delay: 0.3s;">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <input type="email" id="email" formControlName="email" placeholder="ejemplo@utp.edu.pe">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
          <span class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">El correo es obligatorio</span>
          <span class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">Formato de correo inválido</span>
        </div>

        <div class="form-group puzzle-piece" style="animation-delay: 0.4s;">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" formControlName="password" placeholder="••••••••">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
          </div>
          <span class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">La contraseña es obligatoria</span>
        </div>

        <button type="submit" [disabled]="cargando" class="btn-submit puzzle-piece" style="animation-delay: 0.5s;">
          {{ cargando ? 'Autenticando...' : 'Iniciar Sesión' }}
        </button>

        <div *ngIf="mensaje" class="feedback-msg puzzle-piece" style="animation-delay: 0.6s;" [ngClass]="{'error': error, 'success': !error}">
          {{ mensaje }}
        </div>
      </form>

      <div class="login-card-footer puzzle-piece" style="animation-delay: 0.7s;">
        <p>¿No tienes una cuenta? <a routerLink="/registro">Crear cuenta</a></p>
      </div>
    </div>

    <div class="login-footer puzzle-piece" style="animation-delay: 0.8s;">
      <span>SIDPOL v2.0</span>
      <span>•</span>
      <span>Seguridad y Prevención</span>
    </div>
  </div>
</div>
